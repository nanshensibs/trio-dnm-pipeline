[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refmap"
version = "0.1.0"
description = "Automated single-cell analysis by reference mapping: reference building, Symphony-style query mapping, label/continuous transfer with uncertainty, novel-state detection, differential abundance, population-scale, perturbation, cross-modality and cross-species mapping, and versioned open-source atlasing."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "anndata>=0.10",
  "statsmodels>=0.14",
  "networkx>=3.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]
dev = ["pytest>=7.0"]

[project.scripts]
refmap = "refmap.cli:main"

[tool.setuptools]
packages = ["refmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
