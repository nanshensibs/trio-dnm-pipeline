# vcfanno configuration applied to the normalised trio VCF before `trio-dnm call`.
# Paths are placeholders: point them at your local resource bundle.

[[annotation]]
file = "/refs/gnomad/gnomad.joint.v4.1.sites.vcf.gz"   # gnomAD v4.1 joint (exomes + genomes)
fields = ["AF_joint", "AF_joint_grpmax"]
names = ["gnomAD_AF", "gnomAD_grpmax_AF"]
ops = ["self", "self"]

[[annotation]]
file = "/refs/clinvar/clinvar.vcf.gz"
fields = ["CLNSIG", "CLNREVSTAT"]
names = ["CLNSIG", "CLNREVSTAT"]
ops = ["self", "self"]

[[annotation]]
file = "/refs/inhouse/pon.sites.vcf.gz"   # >=100 unrelated normals processed identically
fields = ["AF"]
names = ["PON_AF"]
ops = ["self"]
