[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trio-dnm"
version = "2.0.0"
description = "Trio de novo mutation pipeline: filter cascade, Bayesian trio posterior, mosaic tracks, ACMG-aware annotation, sanity checks, signatures and somatic analysis."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
trio-dnm = "trio_dnm.cli:main"

[tool.setuptools]
packages = ["trio_dnm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
